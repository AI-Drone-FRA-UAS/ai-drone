name: Projektseite

# Builds site/ and publishes it to GitHub Pages. Pages must be switched to
# "GitHub Actions" as its source once, under Settings → Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "README_HOTSPOT.md"
      - "servo_instruction.md"
      - "19-06-session.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the site
        run: uv run --group docs python site/build.py

      # enablement lets the workflow's own token create the Pages site, so no
      # repository admin has to switch the source over by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
