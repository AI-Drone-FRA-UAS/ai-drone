[project]
name = "ai-drone"
version = "0.1.0"
description = "Raspberry Pi AI camera and ArduPilot sensor tools for the drone"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymavlink>=2.4.49",
    "pyserial>=3.5",
]

[dependency-groups]
raspi = [
    "modlib==1.3.1",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "rich>=15.0.0",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]

[tool.uv]
# Runtime commands stay lightweight on the laptop. deploy.sh explicitly adds
# the raspi group on the Pi; development tools are opt-in with --group dev.
default-groups = []
