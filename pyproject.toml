[project]
name = "ai-drone"
version = "0.1.0"
description = "Raspberry Pi AI camera and ArduPilot sensor tools for the drone"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "future>=1.0.0",
    "mavproxy>=1.8.74",
    "pillow>=12.2.0",
    "pymavlink>=2.4.49",
    "pyserial>=3.5",
]

[project.scripts]
autoconnect = "ai_drone.connect:auto_main"
drone-apriltag = "ai_drone.cli.apriltag:main"
drone-config-export = "ai_drone.cli.config_export:main"
drone-config-sync = "ai_drone.config_sync:main"
drone-console = "ai_drone.console:main"
drone-control = "ai_drone.cli.control:main"
drone-deploy = "ai_drone.deploy:main"
drone-health = "ai_drone.health:main"
drone-lidar = "ai_drone.cli.lidar:main"
drone-motor-test = "ai_drone.cli.motor_test:main"
drone-picam = "ai_drone.cli.picam:main"
drone-record = "ai_drone.cli.record:main"
drone-servo = "ai_drone.cli.servo:main"
manuconnect = "ai_drone.connect:manual_main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
raspi = [
    "modlib==1.3.1",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "rich>=15.0.0",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]

[tool.uv]
# Runtime commands stay lightweight on the laptop. drone-deploy explicitly adds
# the raspi group on the Pi; development tools are opt-in with --group dev.
default-groups = []

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
