[project]
name = "ai-drone"
version = "0.1.0"
description = "Raspberry Pi AI camera and ArduPilot sensor tools for the drone"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "future>=1.0.0",
    "numpy>=2.3.5",
    "pillow>=12.2.0",
    "pymavlink>=2.4.49",
    "pyserial>=3.5",
]

[project.scripts]
drone = "ai_drone.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
raspi = [
    "opencv-python>=4.11.0.86",
]
dev = [
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
docs = [
    "markdown-it-py>=3.0",
]

[tool.uv]
# Pi vision and development tools are opt-in groups.
default-groups = []

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.deptry]
exclude = ["artifacts", "aitrios-rpi-sample-apps", "tests", "\\.venv"]
non_dev_dependency_groups = ["raspi", "docs"]

[tool.deptry.per_rule_ignores]
# DEP002: declared on purpose, never imported by name.
#   pyserial, future - runtime requirements of pymavlink's serial transport.
#   pillow - required by the Pi camera/JPEG path via Picamera2.
DEP002 = ["pyserial", "future", "pillow"]
# Native Pi packages come from apt and load only in hardware paths.
DEP001 = ["picamera2", "gpiozero", "apriltag"]

[tool.deptry.package_module_name_map]
# opencv-python is only installed in the raspi group, so deptry cannot read
# its module name from installed metadata on a laptop.
opencv-python = ["cv2"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = ["sitl: opt-in ArduCopter software-in-the-loop integration tests"]
