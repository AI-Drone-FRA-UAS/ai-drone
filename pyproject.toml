[project]
name = "ai-drone"
version = "0.1.0"
description = "AI drone companion — camera, CV, and flight integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[dependency-groups]
desktop = [
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pillow>=12.2.0",
]
raspi = [
    "modlib==1.3.1",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pyserial>=3.5",
]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
