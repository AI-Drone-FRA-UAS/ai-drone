# Codex tools for ordinary ai-drone development.
# Context7 remains available; GitHub repository work uses git and gh.

[features]
apps = false

[plugins."github@openai-curated"]
enabled = false

[plugins."github@openai-curated-remote"]
enabled = false

[plugins."github@chatgpt-global"]
enabled = false

[plugins."codex-security@openai-curated"]
